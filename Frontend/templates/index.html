<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Fridge</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="topbar">

    <div class="brand">
        ❄️ Smart Fridge
    </div>

    <div class="top-actions">

        <button
            class="top-btn scan-top-btn"
            onclick="openCameraModal()"
        >
            📷 Scan Food
        </button>

        <button
            class="top-btn"
            onclick="openAddModal()"
        >
            ＋ Add Food
        </button>

        <button
            class="top-btn menu-top-btn"
            onclick="getMenuSuggestions()"
        >
            🤖 AI แนะนำเมนู
        </button>

    </div>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main class="container">


    <!-- FOOD LIST -->

    <section class="food-section">

        <div class="section-header">

            <div>

                <h2>
                    🥬 อาหารในตู้เย็น
                </h2>

                <p>
                    รายการวัตถุดิบทั้งหมด
                </p>

            </div>

            <button
                class="refresh-btn"
                onclick="loadFoods()"
            >
                ↻ รีเฟรช
            </button>

        </div>


        <div
            id="foodsList"
            class="foods-list"
        >

            <div class="loading">
                กำลังโหลดข้อมูล...
            </div>

        </div>

    </section>



    <!-- AI MENU -->

    <section class="menu-section">

        <div class="section-header">

            <div>

                <h2>
                    🍳 AI แนะนำเมนู
                </h2>

                <p>
                    วิเคราะห์จากวัตถุดิบในตู้เย็น
                </p>

            </div>

        </div>


        <div
            id="menuResult"
            class="menu-result"
        >

            <div class="empty-menu">

                <div class="empty-icon">
                    🤖
                </div>

                <p>
                    กด "AI แนะนำเมนู"
                    เพื่อให้ AI วิเคราะห์อาหารในตู้เย็น
                </p>

            </div>

        </div>

    </section>

</main>



<!-- =========================================
     ADD / EDIT FOOD MODAL
========================================= -->

<div
    id="foodModal"
    class="modal"
>

    <div class="food-modal-box">


        <button
            class="modal-close"
            onclick="closeModal()"
        >
            ×
        </button>


        <h2 id="modalTitle">
            เพิ่มอาหาร
        </h2>


        <p class="modal-subtitle">
            กรอกข้อมูลวัตถุดิบ
        </p>


        <div class="form-group">

            <label>
                ชื่อวัตถุดิบ
            </label>

            <input
                type="text"
                id="foodName"
                placeholder="เช่น หมู"
            >

        </div>


        <div class="form-group">

            <label>
                ปริมาณ
            </label>

            <input
                type="text"
                id="foodQuantity"
                placeholder="เช่น 500 g"
            >

        </div>


        <div class="form-group">

            <label>
                สถานที่เก็บ
            </label>

            <select id="foodLocation">

                <option value="ช่องธรรมดา">
                    ช่องธรรมดา
                </option>

                <option value="ช่องแช่แข็ง">
                    ช่องแช่แข็ง
                </option>

                <option value="ช่องแช่ผัก">
                    ช่องแช่ผัก
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                วันหมดอายุ
            </label>

            <input
                type="date"
                id="foodExpiry"
            >

        </div>


        <div class="form-buttons">

            <button
                class="save-btn"
                onclick="saveFood()"
            >
                ✓ บันทึก
            </button>

            <button
                class="cancel-btn"
                onclick="closeModal()"
            >
                ยกเลิก
            </button>

        </div>

    </div>

</div>



<!-- =========================================
     SCAN FOOD MODAL
     แบบเดิม
========================================= -->

<div
    id="cameraModal"
    class="scan-modal"
>

    <div class="scan-box">


        <!-- CLOSE -->

        <button
            class="scan-close"
            onclick="closeCameraModal()"
        >
            ×
        </button>


        <!-- TITLE -->

        <h2 class="scan-title">
            📷 Scan Food
        </h2>


        <p class="scan-subtitle">
            ถ่ายรูปวัตถุดิบเพื่อให้ AI วิเคราะห์
        </p>


        <!-- CAMERA -->

        <div class="camera-container">

            <video
                id="video"
                autoplay
                playsinline
            ></video>


            <img
                id="photoPreview"
                class="photo-preview"
                alt="รูปอาหาร"
            >

        </div>


        <!-- BUTTONS -->

        <div class="scan-buttons">


            <button
                id="takePhotoBtn"
                class="scan-btn green"
                onclick="captureImage()"
            >
                📷 ถ่ายรูป
            </button>


            <button
                id="usePhotoBtn"
                class="scan-btn blue"
                onclick="usePhoto()"
                disabled
            >
                ✓ ใช้รูปนี้
            </button>


        </div>


        <!-- RESULT -->

        <div
            id="scanResult"
            class="scan-result"
        ></div>


    </div>

</div>



<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

</body>
</html>
